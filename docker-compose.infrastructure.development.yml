# ============================================================
# Development infrastructure (Postgres, Redis, Kafka, ClickHouse, TimescaleDB).
# Pair: .env.development (mandatory — no .env fallback).
# Included by docker-compose.development.yml.
#
# Usage (standalone infra):
#   docker compose --env-file .env.development -f docker-compose.infrastructure.development.yml up -d
#   docker compose --env-file .env.development -f docker-compose.infrastructure.development.yml --profile kafka up -d
#   docker compose --env-file .env.development -f docker-compose.infrastructure.development.yml --profile clickhouse up -d
#   docker compose --env-file .env.development -f docker-compose.infrastructure.development.yml --profile timescale up -d
#
# Profiles:
#   - kafka: Kafka (KRaft combined mode — broker + controller)
#   - clickhouse: ClickHouse
#   - timescale: TimescaleDB
# ============================================================

name: crypto-trading-dev

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-trading-dev-postgres
    restart: unless-stopped
    networks:
      - crypto-trading-network
    environment:
      POSTGRES_USER: ${CORE_DB_USERNAME:?CORE_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?CORE_DB_PASSWORD is required}
      POSTGRES_DB: ${CORE_DB_NAME:?CORE_DB_NAME is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CORE_DB_PORT:-5432}:5432"
    volumes:
      - crypto-trading-dev-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USERNAME} -d ${CORE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: crypto-trading-dev-redis
    restart: unless-stopped
    networks:
      - crypto-trading-network
    command: >
      sh -c 'if [ -z "$REDIS_PASSWORD" ]; then redis-server --appendonly yes; else redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - crypto-trading-dev-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  # Kafka — KRaft combined mode (broker + controller on same process, single node, RF=1).
  # See docs/kafka-kraft.md for the rationale and operational notes.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: crypto-trading-dev-kafka
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['kafka']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://${APP_HOSTNAME:-localhost}:${KAFKA_EXTERNAL_PORT:-29092}'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_DATA_DIRS: /var/lib/kafka/data
      # Enable remote JMX so the bitnami/jmx-exporter sidecar can scrape broker MBeans.
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_JMX_OPTS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9999
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=kafka
      TZ: 'UTC'
    volumes:
      - crypto-trading-dev-kafka-data:/var/lib/kafka/data
    ports:
      - "${BIND_HOST:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      # The Confluent entrypoint wires `KAFKA_JMX_OPTS` into `kafka-broker-api-versions`
      # when the healthcheck runs, which causes a stray JMX subscriber to try
      # to bind 9999 again. Disable JMX for the probe by running the client
      # directly with `KAFKA_OPTS` cleared so only the broker process owns
      # the JMX RMI socket.
      test: ["CMD-SHELL", "KAFKA_OPTS= KAFKA_JMX_OPTS= /usr/bin/kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # Kafka JMX exporter sidecar — exposes broker JMX MBeans as Prometheus metrics.
  # Scrape target: Prometheus (or curl http://localhost:9101/metrics).
  # Config file: ./monitoring/kafka-jmx-exporter.yml (keep cardinality low).
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: crypto-trading-dev-kafka-jmx-exporter
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['kafka']
    environment:
      JMX_EXPORTER_CONFIG: /etc/jmx-exporter/kafka.yml
    volumes:
      - ./monitoring/kafka-jmx-exporter.yml:/etc/jmx-exporter/kafka.yml:ro
    ports:
      # Default port 9101 collides with Flutter Dart DevTools on Windows hosts.
      # Use 9191 internally; `KAFKA_JMX_EXPORTER_PORT` overrides the host mapping.
      - "${BIND_HOST:-127.0.0.1}:${KAFKA_JMX_EXPORTER_PORT:-9191}:9191"
    command: ["9191", "/etc/jmx-exporter/kafka.yml"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # bash's /dev/tcp probe is the only reliable check we have inside the
      # bitnami/jmx-exporter image (no wget/curl/busybox). Verify the HTTP
      # socket is open and that the request returns a 200; the deeper
      # "metrics are populated" check happens at Prometheus scrape time.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9191 && printf 'GET /metrics HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ClickHouse — schema SQL trong docker-entrypoint-initdb.d chay tu dong lan dau.
  # Volume reuse (restart) khong chay lai init SQL; dung npm run db:migrate:ch de apply thu cong.
  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: crypto-trading-dev-clickhouse
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['clickhouse']
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_PORT:-8123}:8123"
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - crypto-trading-dev-clickhouse-data:/var/lib/clickhouse
      - ./scripts/docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "127.0.0.1", "--port", "9000", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  # TimescaleDB — PostgreSQL with TimescaleDB extension.
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: crypto-trading-dev-timescaledb
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['timescale']
    environment:
      POSTGRES_USER: ${MARKET_TS_USERNAME:?MARKET_TS_USERNAME is required}
      POSTGRES_PASSWORD: ${MARKET_TS_PASSWORD:?MARKET_TS_PASSWORD is required}
      POSTGRES_DB: ${MARKET_TS_DB:?MARKET_TS_DB is required}
      TIMESCALEDB_TELEMETRY: 'off'
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_MAX_CONNS: 100
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MARKET_TS_PORT:-5433}:5432"
    volumes:
      - crypto-trading-dev-timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_TS_USERNAME} -d ${MARKET_TS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

networks:
  crypto-trading-network:
    name: crypto-trading-dev-network

volumes:
  crypto-trading-dev-postgres-data:
  crypto-trading-dev-timescaledb-data:
  crypto-trading-dev-redis-data:
  crypto-trading-dev-clickhouse-data:
  crypto-trading-dev-kafka-data: