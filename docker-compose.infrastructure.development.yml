# ============================================================
# Development infrastructure (Postgres, Redis, Kafka, ClickHouse, TimescaleDB).
# Pair: .env.development (mandatory — no .env fallback).
# Included by docker-compose.development.yml.
#
# Usage (standalone infra):
#   docker compose --env-file .env.development -f docker-compose.infrastructure.development.yml up -d
#   docker compose --env-file .env.development -f docker-compose.infrastructure.development.yml --profile kafka up -d
#   docker compose --env-file .env.development -f docker-compose.infrastructure.development.yml --profile clickhouse up -d
#
# Profiles:
#   - kafka: Zookeeper + Kafka
#   - clickhouse: ClickHouse
#   - timescale: TimescaleDB
# ============================================================
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_trading_postgres
    networks:
      - crypto-trading-network
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${CORE_DB_USERNAME}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
      POSTGRES_DB: ${CORE_DB_NAME}
      TZ: 'UTC'
    ports:
      - "${CORE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USERNAME} -d ${CORE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto_trading_redis
    networks:
      - crypto-trading-network
    env_file:
      - .env.development
    command: >
      sh -c 'if [ -z "$REDIS_PASSWORD" ]; then redis-server --appendonly yes; else redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Zookeeper — required for Kafka < 3.6. For KRaft mode, see docs/kafka-kraft.md
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: crypto_trading_zookeeper
    networks:
      - crypto-trading-network
    profiles: ['kafka']
    restart: "no"
    env_file:
      - .env.development
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_txn:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181' && echo imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: crypto_trading_kafka
    networks:
      - crypto-trading-network
    profiles: ['kafka']
    restart: "no"
    env_file:
      - .env.development
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_DATA_DIRS: /var/lib/kafka/data
      TZ: 'UTC'
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ClickHouse — schema SQL trong docker-entrypoint-initdb.d chay tu dong lan dau.
  # Volume reuse (restart) khong chay lai init SQL; dung npm run db:migrate:ch de apply thu cong.
  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: crypto_trading_clickhouse
    networks:
      - crypto-trading-network
    profiles: ['clickhouse']
    env_file:
      - .env.development
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: 'UTC'
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "127.0.0.1", "--port", "9000", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # TimescaleDB — PostgreSQL with TimescaleDB extension.
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: crypto_trading_timescaledb
    networks:
      - crypto-trading-network
    profiles: ['timescale']
    env_file:
      - .env.development
    environment:
      POSTGRES_USER: ${MARKET_TS_USERNAME}
      POSTGRES_PASSWORD: ${MARKET_TS_PASSWORD}
      POSTGRES_DB: ${MARKET_TS_DB}
      TIMESCALEDB_TELEMETRY: 'off'
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_MAX_CONNS: 100
      TZ: 'UTC'
    ports:
      - "${MARKET_TS_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_TS_USERNAME} -d ${MARKET_TS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  crypto-trading-network:
    name: crypto-trading-network

volumes:
  postgres_data:
  timescaledb_data:
  redis_data:
  clickhouse_data:
  zookeeper_data:
  zookeeper_txn:
  kafka_data:
