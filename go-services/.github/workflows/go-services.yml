name: Go Services CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'go-services/**'
      - '.github/workflows/go-services.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'go-services/**'
      - '.github/workflows/go-services.yml'
  merge_group:
    branches: [main, develop]

env:
  GO_VERSION: '1.23'

jobs:
  # ─── Market Aggregator ────────────────────────────────────────────────────────

  market-aggregator-lint:
    name: Market Aggregator Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/market-aggregator/go.sum

      - name: Run go vet
        working-directory: go-services/market-aggregator
        run: go vet ./...

      - name: Run staticcheck
        uses: reviewdog/action-staticcheck@v1
        with:
          working-directory: go-services/market-aggregator
          reporter: github-pr-review
          staticcheck_flags: -checks=all,-ST1000

  market-aggregator-test:
    name: Market Aggregator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/market-aggregator/go.sum

      - name: Download dependencies
        working-directory: go-services/market-aggregator
        run: go mod download

      - name: Run tests with race detector
        working-directory: go-services/market-aggregator
        run: go test -race -v -count=1 ./...

      - name: Run tests with coverage
        working-directory: go-services/market-aggregator
        run: |
          go test -race -v -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-market-aggregator
          path: go-services/market-aggregator/coverage.out

  market-aggregator-build:
    name: Market Aggregator Build
    runs-on: ubuntu-latest
    needs: [market-aggregator-lint, market-aggregator-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        working-directory: go-services/market-aggregator
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o market-aggregator ./cmd/market-aggregator

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: go-services/market-aggregator
          push: false
          tags: crypto-trading-market-aggregator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Matching Engine ─────────────────────────────────────────────────────────

  matching-engine-lint:
    name: Matching Engine Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/matching-engine/go.sum

      - name: Run go vet
        working-directory: go-services/matching-engine
        run: go vet ./...

  matching-engine-test:
    name: Matching Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/matching-engine/go.sum

      - name: Download dependencies
        working-directory: go-services/matching-engine
        run: go mod download

      - name: Run tests with race detector
        working-directory: go-services/matching-engine
        run: go test -race -v -count=1 ./...

      - name: Run tests with coverage
        working-directory: go-services/matching-engine
        run: |
          go test -race -v -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matching-engine
          path: go-services/matching-engine/coverage.out

  matching-engine-build:
    name: Matching Engine Build
    runs-on: ubuntu-latest
    needs: [matching-engine-lint, matching-engine-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        working-directory: go-services/matching-engine
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o matching-engine ./cmd/matching-engine

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: go-services/matching-engine
          push: false
          tags: crypto-trading-matching-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Public WS Gateway ────────────────────────────────────────────────────────

  public-ws-gateway-lint:
    name: Public WS Gateway Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/public-ws-gateway/go.sum

      - name: Run go vet
        working-directory: go-services/public-ws-gateway
        run: go vet ./...

  public-ws-gateway-test:
    name: Public WS Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go-services/public-ws-gateway/go.sum

      - name: Download dependencies
        working-directory: go-services/public-ws-gateway
        run: go mod download

      - name: Run tests with race detector
        working-directory: go-services/public-ws-gateway
        run: go test -race -v -count=1 ./...

      - name: Run tests with coverage
        working-directory: go-services/public-ws-gateway
        run: |
          go test -race -v -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-public-ws-gateway
          path: go-services/public-ws-gateway/coverage.out

  public-ws-gateway-build:
    name: Public WS Gateway Build
    runs-on: ubuntu-latest
    needs: [public-ws-gateway-lint, public-ws-gateway-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        working-directory: go-services/public-ws-gateway
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o public-ws-gateway ./cmd/public-ws-gateway

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: go-services/public-ws-gateway
          push: false
          tags: crypto-trading-public-ws-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Go Services Integration Test (all services) ───────────────────────────────

  go-services-integration:
    name: Go Services Integration Test
    runs-on: ubuntu-latest
    needs: [market-aggregator-build, matching-engine-build, public-ws-gateway-build]
    if: github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: |
          # Integration tests would be run here
          # They would start all 3 services and verify they start correctly
          echo "Integration test placeholder"
