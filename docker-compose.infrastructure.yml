# Core infra for local development.
# Variables are interpolated from .env.development by npm scripts.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_trading_postgres
    environment:
      POSTGRES_USER: ${CORE_DB_USERNAME:-${DB_USERNAME}}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-${DB_PASSWORD}}
      POSTGRES_DB: ${CORE_DB_NAME:-${DB_NAME}}
      TZ: 'UTC'
    ports:
      - "${CORE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USERNAME:-${DB_USERNAME}} -d ${CORE_DB_NAME:-${DB_NAME}}"]
      timeout: 10s
      retries: 10
      interval: 10s

  redis:
    image: redis:7-alpine
    container_name: crypto_trading_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 10s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  crypto_network:
    driver: bridge
