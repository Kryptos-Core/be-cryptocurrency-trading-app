# Biến ${DB_*}, ${REDIS_*} được nội suy từ file env khi chạy Compose (mặc định dev: .env.development).
# Khuyến nghị: npm run docker:infra:up  (tương đương --env-file .env.development).
# Development/staging/production: docker compose -f docker-compose.infrastructure.yml --env-file .env.development up -d
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crypto_trading_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: 'UTC'
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - crypto_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  redis:
    image: redis:7-alpine
    container_name: crypto_trading_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - crypto_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 10s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  crypto_network:
    driver: bridge
