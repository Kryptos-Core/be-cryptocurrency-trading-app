<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading WebSocket Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace; 
            background: #1a1a1a; 
            color: #0f0; 
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #0f0; }
        .status { 
            padding: 10px; 
            margin-bottom: 20px; 
            border-radius: 5px;
            font-weight: bold;
        }
        .status.connected { background: #0a3a0a; color: #0f0; }
        .status.disconnected { background: #3a0a0a; color: #f00; }
        .status.authenticating { background: #3a3a0a; color: #ff0; }
        
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 5px;
            border: 1px solid #0f0;
        }
        
        input, button {
            padding: 8px 12px;
            margin-right: 10px;
            background: #1a1a1a;
            border: 1px solid #0f0;
            color: #0f0;
            border-radius: 3px;
            cursor: pointer;
        }
        
        button:hover { background: #0f0; color: #1a1a1a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .log {
            background: #0a0a0a;
            border: 1px solid #0f0;
            border-radius: 5px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .log-entry { 
            margin-bottom: 5px; 
            padding: 5px;
            border-left: 2px solid #0f0;
            padding-left: 10px;
        }
        
        .log-entry.error { border-left-color: #f00; color: #f99; }
        .log-entry.success { border-left-color: #0f0; color: #0f0; }
        .log-entry.info { border-left-color: #0ff; color: #0ff; }
        
        .ticker-data {
            background: #1a1a1a;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            border: 1px solid #0f0;
            display: none;
        }
        
        .ticker-data.active { display: block; }
        .ticker-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .ticker-item { background: #2a2a2a; padding: 10px; border-radius: 3px; }
        .ticker-label { color: #0ff; font-size: 11px; }
        .ticker-value { color: #0f0; font-size: 14px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Trading WebSocket Test</h1>
        
        <div id="status" class="status disconnected">Status: Disconnected</div>
        
        <div class="controls">
            <input type="text" id="tokenInput" placeholder="Enter JWT token...">
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
            <button id="clearBtn" onclick="clearLog()">Clear Log</button>
        </div>
        
        <div class="controls">
            <input type="number" id="pairIdInput" placeholder="Pair ID" value="1">
            <input type="text" id="channelInput" placeholder="Channel (ticker/ohlc)" value="ticker">
            <input type="text" id="intervalInput" placeholder="Interval (1m, 5m, etc)" value="1m">
            <button id="subscribeBtn" onclick="subscribe()" disabled>Subscribe</button>
            <button id="unsubscribeBtn" onclick="unsubscribe()" disabled>Unsubscribe</button>
        </div>
        
        <div class="log" id="log"></div>
        
        <div class="ticker-data" id="tickerData">
            <h3>📊 Live Ticker Data</h3>
            <div class="ticker-grid" id="tickerGrid"></div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let socket = null;
        
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        function updateStatus(text, type) {
            const status = document.getElementById('status');
            status.textContent = `Status: ${text}`;
            status.className = `status ${type}`;
        }
        
        function connect() {
            const token = document.getElementById('tokenInput').value;
            
            if (!token) {
                log('❌ Token is required', 'error');
                return;
            }
            
            updateStatus('Connecting...', 'authenticating');
            
            try {
                socket = io('http://localhost:3000/trading', {
                    reconnection: true,
                    reconnectionDelay: 1000,
                    reconnectionDelayMax: 5000,
                    reconnectionAttempts: 5
                });
                
                socket.on('connect', () => {
                    log('✅ WebSocket connected', 'success');
                    updateStatus('Connected', 'connected');
                    
                    // Send authentication
                    log('🔐 Sending authentication...', 'info');
                    socket.emit('auth', { token });
                });
                
                socket.on('auth_response', (response) => {
                    if (response.authenticated) {
                        log('✅ Authenticated successfully', 'success');
                        document.getElementById('subscribeBtn').disabled = false;
                        document.getElementById('unsubscribeBtn').disabled = false;
                    } else {
                        log(`❌ Authentication failed: ${response.error}`, 'error');
                        updateStatus('Authentication Failed', 'disconnected');
                    }
                });
                
                socket.on('ticker', (data) => {
                    log(`📊 Ticker: ${data.symbol} - ${data.last_price}`, 'info');
                    updateTickerData(data);
                });
                
                socket.on('ohlc', (data) => {
                    log(`📈 OHLC: ${data.symbol} (${data.interval}) - O:${data.open} H:${data.high} L:${data.low} C:${data.close}`, 'info');
                });
                
                socket.on('error', (error) => {
                    log(`❌ Error: ${error.message || JSON.stringify(error)}`, 'error');
                });
                
                socket.on('disconnect', () => {
                    log('❌ WebSocket disconnected', 'error');
                    updateStatus('Disconnected', 'disconnected');
                    document.getElementById('subscribeBtn').disabled = true;
                    document.getElementById('unsubscribeBtn').disabled = true;
                });
                
            } catch (error) {
                log(`❌ Connection error: ${error.message}`, 'error');
                updateStatus('Connection Error', 'disconnected');
            }
        }
        
        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                log('Disconnected', 'info');
                updateStatus('Disconnected', 'disconnected');
                document.getElementById('subscribeBtn').disabled = true;
                document.getElementById('unsubscribeBtn').disabled = true;
            }
        }
        
        function subscribe() {
            if (!socket || !socket.connected) {
                log('❌ Not connected', 'error');
                return;
            }
            
            const pairId = document.getElementById('pairIdInput').value;
            const channel = document.getElementById('channelInput').value;
            const interval = document.getElementById('intervalInput').value;
            
            const payload = {
                pair_id: parseInt(pairId),
                channel: channel,
                interval: channel === 'ohlc' ? interval : undefined
            };
            
            log(`📤 Subscribing to pair ${pairId} (${channel})...`, 'info');
            socket.emit('subscribe', payload);
            document.getElementById('tickerData').classList.add('active');
        }
        
        function unsubscribe() {
            if (!socket || !socket.connected) {
                log('❌ Not connected', 'error');
                return;
            }
            
            const pairId = document.getElementById('pairIdInput').value;
            const channel = document.getElementById('channelInput').value;
            
            const payload = {
                pair_id: parseInt(pairId),
                channel: channel
            };
            
            log(`📤 Unsubscribing from pair ${pairId}...`, 'info');
            socket.emit('unsubscribe', payload);
            document.getElementById('tickerData').classList.remove('active');
        }
        
        function updateTickerData(data) {
            const grid = document.getElementById('tickerGrid');
            grid.innerHTML = `
                <div class="ticker-item">
                    <div class="ticker-label">Symbol</div>
                    <div class="ticker-value">${data.symbol || 'N/A'}</div>
                </div>
                <div class="ticker-item">
                    <div class="ticker-label">Last Price</div>
                    <div class="ticker-value">$${parseFloat(data.last_price || 0).toFixed(4)}</div>
                </div>
                <div class="ticker-item">
                    <div class="ticker-label">24h High</div>
                    <div class="ticker-value">$${parseFloat(data.high_24h || 0).toFixed(4)}</div>
                </div>
                <div class="ticker-item">
                    <div class="ticker-label">24h Low</div>
                    <div class="ticker-value">$${parseFloat(data.low_24h || 0).toFixed(4)}</div>
                </div>
                <div class="ticker-item">
                    <div class="ticker-label">Volume 24h</div>
                    <div class="ticker-value">${parseFloat(data.volume_24h || 0).toFixed(2)}</div>
                </div>
                <div class="ticker-item">
                    <div class="ticker-label">Change 24h</div>
                    <div class="ticker-value" style="color: ${(data.change_24h_percent || 0) >= 0 ? '#0f0' : '#f00'}">
                        ${(data.change_24h_percent || 0).toFixed(2)}%
                    </div>
                </div>
            `;
        }
        
        // Initial setup
        document.getElementById('disconnectBtn').disabled = true;
        document.getElementById('subscribeBtn').disabled = true;
        document.getElementById('unsubscribeBtn').disabled = true;
        
        log('🟢 Ready to connect. Enter token and click Connect.', 'info');
    </script>
</body>
</html>
