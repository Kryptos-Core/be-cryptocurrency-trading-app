# Main Docker Compose for Cryptocurrency Trading App (Backend)
#
# Cách sử dụng:
#   docker compose up -d                        # Chạy infrastructure + services
#   docker compose up -d --profile services      # Chỉ chạy Go services
#   docker compose up -d --profile kafka         # Infrastructure + Kafka
#   docker compose up -d --profile clickhouse    # Infrastructure + ClickHouse
#
# Profiles:
#   - infrastructure (default): Postgres + Redis
#   - kafka: Zookeeper + Kafka
#   - clickhouse: ClickHouse
#   - timescale: TimescaleDB
#   - services: market-aggregator + matching-engine + public-ws-gateway

include:
  - ./docker-compose.infrastructure.yml

services:
  # Go Services
  market-aggregator:
    build:
      context: ./go-services
      dockerfile: market-aggregator/Dockerfile
    container_name: crypto_trading_market_aggregator
    profiles: ['services']
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - CORE_DB_HOST=postgres
      - CORE_DB_PORT=5432
      - CORE_DB_USER=${CORE_DB_USERNAME}
      - CORE_DB_PASSWORD=${CORE_DB_PASSWORD}
      - CORE_DB_NAME=${CORE_DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${MARKET_AGGREGATOR_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crypto-trading-network

  matching-engine:
    build:
      context: ./go-services
      dockerfile: matching-engine/Dockerfile
    container_name: crypto_trading_matching_engine
    profiles: ['services']
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - CORE_DB_HOST=postgres
      - CORE_DB_PORT=5432
      - CORE_DB_USER=${CORE_DB_USERNAME}
      - CORE_DB_PASSWORD=${CORE_DB_PASSWORD}
      - CORE_DB_NAME=${CORE_DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${MATCHING_ENGINE_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crypto-trading-network

  public-ws-gateway:
    build:
      context: ./go-services
      dockerfile: public-ws-gateway/Dockerfile
    container_name: crypto_trading_public_ws_gateway
    profiles: ['services']
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${PUBLIC_WS_GATEWAY_PORT:-8082}:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crypto-trading-network

networks:
  crypto-trading-network:
    name: crypto-trading-network
