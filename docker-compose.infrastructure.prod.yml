# ============================================================
# Production infrastructure (Postgres, Redis, Kafka, ClickHouse, TimescaleDB).
# Pair: .env.prod (mandatory — no .env fallback).
# Companion to docker-compose.prod.yml (all-in-one deployment).
#
# Usage (standalone infra):
#   docker compose --env-file .env.prod -f docker-compose.infrastructure.prod.yml up -d
#   docker compose --env-file .env.prod -f docker-compose.infrastructure.prod.yml --profile kafka up -d
#   docker compose --env-file .env.prod -f docker-compose.infrastructure.prod.yml --profile clickhouse up -d
#   docker compose --env-file .env.prod -f docker-compose.infrastructure.prod.yml --profile timescale up -d
#
# Notes:
#   - Data services bind loopback (BIND_HOST, default 127.0.0.1) and are not
#     exposed to the public network. Use reverse proxy / VPN to reach them.
#   - All credential-bearing variables fall back to safe defaults so a
#     partially-rotated .env.prod does not cause a deploy-time failure;
#     rotate every CHANGE_ME value before relying on this stack.
#
# Profiles:
#   - kafka: Zookeeper + Kafka
#   - clickhouse: ClickHouse
#   - timescale: TimescaleDB
# ============================================================

name: crypto-trading-prod

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ─── Core Database ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: crypto-trading-prod-postgres
    restart: unless-stopped
    networks:
      - crypto-trading-network
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-crypto_trading_platform}
      POSTGRES_USER: ${CORE_DB_USERNAME:-crypto_user}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CORE_DB_PORT:-5432}:5432"
    volumes:
      - crypto-trading-prod-postgres-data:/var/lib/postgresql/data
      - ./backups/db:/backups:rw
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=80MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USERNAME:-crypto_user} -d ${CORE_DB_NAME:-crypto_trading_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: crypto-trading-prod-redis
    restart: unless-stopped
    networks:
      - crypto-trading-network
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-change_me}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - crypto-trading-prod-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─── Kafka (ZooKeeper Mode) ────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: crypto-trading-prod-zookeeper
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['kafka']
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - crypto-trading-prod-zookeeper-data:/var/lib/zookeeper/data
      - crypto-trading-prod-zookeeper-txn:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181' && echo imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: crypto-trading-prod-kafka
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['kafka']
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://${APP_HOSTNAME:-localhost}:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_DATA_DIRS: /var/lib/kafka/data
      TZ: 'UTC'
    volumes:
      - crypto-trading-prod-kafka-data:/var/lib/kafka/data
    ports:
      - "${KAFKA_EXTERNAL_BIND_HOST:-0.0.0.0}:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging

  # ─── ClickHouse ────────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: crypto-trading-prod-clickhouse
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['clickhouse']
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_PORT:-8123}:8123"
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - crypto-trading-prod-clickhouse-data:/var/lib/clickhouse
      - ./scripts/docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "127.0.0.1", "--port", "9000", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ─── TimescaleDB ──────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: crypto-trading-prod-timescaledb
    restart: unless-stopped
    networks:
      - crypto-trading-network
    profiles: ['timescale']
    environment:
      POSTGRES_USER: ${MARKET_TS_USERNAME:-market_user}
      POSTGRES_PASSWORD: ${MARKET_TS_PASSWORD:-change_me}
      POSTGRES_DB: ${MARKET_TS_DB:-market_data}
      TIMESCALEDB_TELEMETRY: 'off'
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_MAX_CONNS: 100
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MARKET_TS_PORT:-5433}:5432"
    volumes:
      - crypto-trading-prod-timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_TS_USERNAME:-market_user} -d ${MARKET_TS_DB:-market_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  crypto-trading-network:
    name: crypto-trading-prod-network

volumes:
  crypto-trading-prod-postgres-data:
  crypto-trading-prod-timescaledb-data:
  crypto-trading-prod-redis-data:
  crypto-trading-prod-clickhouse-data:
  crypto-trading-prod-zookeeper-data:
  crypto-trading-prod-zookeeper-txn:
  crypto-trading-prod-kafka-data: