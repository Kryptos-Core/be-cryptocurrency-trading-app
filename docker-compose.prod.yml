# ============================================================
# Production Docker Compose - All-in-One Deployment
# ============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# With migrations:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d app
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec app npm run db:migrate:prod
#
# Stop:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod down
# ============================================================

name: crypto-trading-prod

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  clickhouse_data:
  timescaledb_data:

services:
  # ─── Core Database ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CORE_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USERNAME}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: 'UTC'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/db:/backups:rw
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    shm_size: 256mb
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=128MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_wal_size=2GB
      -c min_wal_size=80MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USERNAME} -d ${CORE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-network

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # ─── Kafka (KRaft combined mode — broker + controller on same process, single node, RF=1) ─────
  # See docs/kafka-kraft.md for rationale and operational notes.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://${APP_HOSTNAME}:${KAFKA_EXTERNAL_PORT:-29092}'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_DATA_DIRS: /var/lib/kafka/data
      # Enable remote JMX so the bitnami/jmx-exporter sidecar can scrape broker MBeans.
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_JMX_OPTS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9999
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=kafka
      TZ: 'UTC'
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
      - "${KAFKA_EXTERNAL_BIND_HOST:-0.0.0.0}:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      # Healthcheck runs JMX-free; the broker JVM already owns port 9999.
      test: ["CMD-SHELL", "KAFKA_OPTS= KAFKA_JMX_OPTS= /usr/bin/kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-network

  # ─── Kafka JMX exporter sidecar ───────────────────────────────────────────────────
  # Exposes broker JMX MBeans as Prometheus metrics on :9101.
  # Prometheus scrape target is added in docker-compose.monitoring.prod.yml.
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: kafka-jmx-exporter
    restart: unless-stopped
    environment:
      JMX_EXPORTER_CONFIG: /etc/jmx-exporter/kafka.yml
    volumes:
      - ./monitoring/kafka-jmx-exporter.yml:/etc/jmx-exporter/kafka.yml:ro
    ports:
      - "${KAFKA_JMX_EXPORTER_BIND_HOST:-0.0.0.0}:${KAFKA_JMX_EXPORTER_PORT:-9101}:9101"
    command: ["9101", "/etc/jmx-exporter/kafka.yml"]
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9101 && printf 'GET /metrics HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend-network

  # ─── ClickHouse ────────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_PORT:-8123}:8123"
      - "${BIND_HOST:-127.0.0.1}:${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "127.0.0.1", "--port", "9000", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - backend-network

  # ─── TimescaleDB ──────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MARKET_TS_USERNAME}
      POSTGRES_PASSWORD: ${MARKET_TS_PASSWORD}
      POSTGRES_DB: ${MARKET_TS_DB}
      TIMESCALEDB_TELEMETRY: 'off'
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_MAX_CONNS: 100
      TZ: 'UTC'
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MARKET_TS_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MARKET_TS_USERNAME} -d ${MARKET_TS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-network

  # ─── Backend Application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
      args:
        - NODE_ENV=production
    container_name: backend
    image: backend:latest
    restart: unless-stopped
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      CORE_DB_HOST: postgres
      REDIS_HOST: redis
      PORT: 3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - backend-network
    volumes:
      - ./logs:/app/logs:rw
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Go Services (Shadow/Canary by default) ──────────────────────────────────
  market-aggregator:
    build:
      context: ./go-services
      dockerfile: market-aggregator/Dockerfile
    container_name: market_aggregator
    image: market-aggregator:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      SERVICE_NAME: market-aggregator
      SERVICE_ENV: production
      HTTP_ADDR: ":8080"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP: "${MARKET_AGGREGATOR_KAFKA_GROUP:-market-aggregator-prod-v2}"
      KAFKA_TOPICS: "${MARKET_AGGREGATOR_KAFKA_TOPICS:-crypto-trading.tradeexecuted,crypto-trading.market.ticker,market.ticker}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      POSTGRES_HOST: "postgres"
      SHADOW_MODE: "${MARKET_AGGREGATOR_SHADOW_MODE:-true}"
      READ_ONLY_MODE: "${MARKET_AGGREGATOR_READ_ONLY_MODE:-true}"
      MUTATIONS_ENABLED: "false"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/app/market-aggregator", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  matching-engine:
    build:
      context: ./go-services
      dockerfile: matching-engine/Dockerfile
    container_name: matching_engine
    image: matching-engine:latest
    restart: unless-stopped
    profiles:
      - go-risky
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      SERVICE_NAME: matching-engine
      SERVICE_ENV: production
      HTTP_ADDR: ":8081"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP: "${MATCHING_ENGINE_KAFKA_GROUP:-matching-engine-shadow-prod-v1}"
      KAFKA_TOPICS: "${MATCHING_ENGINE_KAFKA_TOPICS:-crypto-trading.orderplaced,crypto-trading.ordercancelled,crypto-trading.tradeexecuted}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      POSTGRES_HOST: "${CORE_DB_HOST:-postgres}"
      POSTGRES_PORT: "${CORE_DB_PORT:-5432}"
      POSTGRES_USER: "${CORE_DB_USERNAME}"
      POSTGRES_PASSWORD: "${CORE_DB_PASSWORD}"
      POSTGRES_DATABASE: "${CORE_DB_NAME}"
      SHADOW_MODE: "${MATCHING_ENGINE_SHADOW_MODE:-true}"
      READ_ONLY_MODE: "true"
      MUTATIONS_ENABLED: "${MATCHING_ENGINE_MUTATIONS_ENABLED:-false}"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "/app/matching-engine", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  public-ws-gateway:
    build:
      context: ./go-services
      dockerfile: public-ws-gateway/Dockerfile
    container_name: public_ws_gateway
    image: public-ws-gateway:latest
    restart: unless-stopped
    profiles:
      - go-canary
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      SERVICE_NAME: public-ws-gateway
      SERVICE_ENV: production
      HTTP_ADDR: ":8082"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP: "${PUBLIC_WS_GATEWAY_KAFKA_GROUP:-public-ws-gateway-prod-v1}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      POSTGRES_HOST: "postgres"
      SHADOW_MODE: "${PUBLIC_WS_GATEWAY_SHADOW_MODE:-true}"
      READ_ONLY_MODE: "true"
      MUTATIONS_ENABLED: "false"
      CANARY_PERCENT: "${PUBLIC_WS_GATEWAY_CANARY_PERCENT:-0}"
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "/app/public-ws-gateway", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

