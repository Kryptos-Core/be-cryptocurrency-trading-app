# Docker Setup Role
# Installs and configures Docker Engine on target servers

---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  changed_when: false

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  when: ansible_user is defined

- name: Configure Docker daemon (daemon.json)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "5"
        },
        "storage-driver": "overlay2",
        "live-restore": true,
        "userland-proxy": false,
        "icc": false,
        "default-address-pools": [
          {"base": "172.17.0.0/12", "size": 24}
        ]
      }
  notify: Restart Docker

- name: Create Docker logrotate config
  ansible.builtin.copy:
    dest: /etc/logrotate.d/docker-container
    content: |
      /var/lib/docker/containers/*.log {
          rotate 5
          size 50M
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
  when: ansible_os_family == "Debian"

- name: Create app deployment directory
  ansible.builtin.file:
    path: "{{ app_deploy_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ app_deploy_path }}/backups/db"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Create logs directory
  ansible.builtin.file:
    path: "{{ app_deploy_path }}/logs"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'

- name: Setup UFW firewall rules
  community.general.ufw:
    direction: "{{ item.direction }}"
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { direction: 'in', rule: 'allow', port: 22, proto: 'tcp' }
    - { direction: 'in', rule: 'allow', port: 443, proto: 'tcp' }
    - { direction: 'in', rule: 'allow', port: 80, proto: 'tcp' }
  when: false  # Set to true if using UFW

- name: Install Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  notify: Start Fail2ban

handlers:
  - name: Restart Docker
    ansible.builtin.service:
      name: docker
      state: restarted

  - name: Start Fail2ban
    ansible.builtin.service:
      name: fail2ban
      state: started
      enabled: true
