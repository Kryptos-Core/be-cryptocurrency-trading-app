# Prometheus Alert Rules for Crypto Trading Platform

groups:
  - name: crypto-trading-backend
    interval: 30s
    rules:
      # Backend Availability
      - alert: BackendDown
        expr: up{job="crypto-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend API target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape the crypto-backend target for more than 1 minute. Job={{ $labels.job }}, instance={{ $labels.instance }}."
          impact: "API requests, order placement, auth, and websocket-dependent flows may be unavailable."
          action: "Check backend container health/logs, recent deploys, env vars, DB/Redis connectivity, and restart policy."

      # High Error Rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="crypto-backend", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="crypto-backend"}[5m]))
          ) > 0.05
          and
          sum(rate(http_requests_total{job="crypto-backend"}[5m])) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx error rate is above 5%"
          description: "More than 5% of crypto-backend HTTP requests are returning 5xx over 5 minutes while traffic is above 1 req/s."
          impact: "Users may see failed API calls, failed trading operations, or degraded integrations."
          action: "Inspect backend logs by route/status, recent releases, downstream DB/Redis latency, and exception traces."

      # High Latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="crypto-backend"}[5m])) by (le))
          > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency is above 2 seconds"
          description: "95th percentile HTTP request duration for crypto-backend is above 2 seconds for 5 minutes."
          impact: "API, trading screens, and bots may experience slow responses or timeouts."
          action: "Check slow endpoints, DB queries, Redis latency, CPU saturation, and external RPC/provider calls."

  - name: infrastructure
    interval: 30s
    rules:
      # Monitoring pipeline targets
      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|telegram-bridge|cadvisor|docker-health-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }} for more than 1 minute."
          impact: "Alert delivery or monitoring visibility may be degraded; Telegram notifications can stop if alertmanager or telegram-bridge is affected."
          action: "Check docker ps/health/logs for {{ $labels.job }}, container restart count, network attachment, and recent config changes."

      # Docker container healthcheck status
      - alert: ContainerUnhealthy
        expr: docker_container_health_status{health_status="unhealthy"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} is unhealthy"
          description: "Docker healthcheck reports unhealthy for container {{ $labels.container }}. Image={{ $labels.image }}, compose_service={{ $labels.compose_service }}."
          impact: "The service may be degraded or unavailable even if the process is still running."
          action: "Run docker inspect/logs for {{ $labels.container }}, check its healthcheck command, dependencies, recent deploys, and restart if needed."

      # Docker container stopped/exited state
      - alert: ContainerExited
        expr: docker_container_running{container!=""} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} is not running"
          description: "Docker reports container {{ $labels.container }} is stopped/exited. Image={{ $labels.image }}, compose_service={{ $labels.compose_service }}."
          impact: "The service provided by this container is unavailable."
          action: "Check docker ps -a, docker logs {{ $labels.container }}, exit code metric, restart policy, OOM events, and recent deployments."

      # Docker container restart loop or repeated crash
      - alert: ContainerRestarting
        expr: increase(docker_container_restart_count[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container }} restarted recently"
          description: "Docker restart count increased within 5 minutes for container {{ $labels.container }}. Image={{ $labels.image }}, compose_service={{ $labels.compose_service }}."
          impact: "Users may see intermittent failures, dropped websocket connections, or delayed background processing."
          action: "Inspect docker logs around the restart, exit code, OOM kills, dependency availability, and recent config/image changes."

      # Container memory pressure from cAdvisor
      - alert: ContainerMemoryHigh
        expr: |
          (
            container_memory_working_set_bytes{name!="", image!=""}
            /
            container_spec_memory_limit_bytes{name!="", image!=""}
          ) > 0.9
          and
          container_spec_memory_limit_bytes{name!="", image!=""} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} memory usage is above 90%"
          description: "Container {{ $labels.name }} working set memory is above 90% of its configured limit for 5 minutes."
          impact: "The container may be close to OOM kill or severe GC/latency pressure."
          action: "Inspect memory trend, heap usage, recent traffic/jobs, memory leaks, and container limit sizing."

      # Container CPU pressure from cAdvisor
      - alert: ContainerCpuHigh
        expr: rate(container_cpu_usage_seconds_total{name!="", image!=""}[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU usage is high"
          description: "Container {{ $labels.name }} is using more than 0.9 CPU cores for 10 minutes."
          impact: "The service may respond slowly and affect dependent flows."
          action: "Check hot endpoints/jobs, traffic spikes, DB waits, matching/worker loops, and recent deploys."

      # Host Down
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Server exporter target {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape node-exporter for more than 1 minute. Job={{ $labels.job }}, instance={{ $labels.instance }}."
          impact: "Host metrics are unavailable; the server may be down, unreachable, or node-exporter may have stopped."
          action: "Check VM reachability, node-exporter container/service status, firewall/security group, and Docker daemon health."

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs|ramfs", device!~"rootfs"}
            /
            node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs|ramfs", device!~"rootfs"}
          ) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root disk free space is below 10% on {{ $labels.instance }}"
          description: "The root filesystem has less than 10% free space for 5 minutes. Mount={{ $labels.mountpoint }}, device={{ $labels.device }}."
          impact: "Database writes, logs, Docker pulls, and application persistence can fail when disk fills up."
          action: "Clean old Docker images/containers/logs, rotate large logs, verify database volume growth, or expand disk."

      # Load Average High
      - alert: LoadAverageHigh
        expr: node_load1 / count(node_cpu_seconds_total{mode="idle"}) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Server load average is high on {{ $labels.instance }}"
          description: "1-minute load average is above 80% of CPU count for 10 minutes."
          impact: "Containers may respond slowly; API latency, DB queries, and background workers can degrade."
          action: "Inspect top processes, container CPU usage, noisy jobs, DB load, and recent traffic spikes."

  - name: deadmansswitch
    interval: 60s
    rules:
      - alert: DeadMansSwitch
        expr: vector(1)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Dead Man's Switch heartbeat"
          description: "Prometheus alert pipeline is alive and sending the scheduled heartbeat."
          impact: "This is an expected heartbeat, not an outage."
          action: "If this heartbeat stops arriving, check Prometheus, Alertmanager, telegram-bridge, and Telegram credentials."
