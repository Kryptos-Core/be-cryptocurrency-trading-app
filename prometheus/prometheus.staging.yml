# Prometheus configuration for Crypto Trading Platform
# Default scrape targets: Prometheus, Alertmanager, Node Exporter, backend, and
# the always-on market aggregator. Optional profile-based services such as
# matching-engine and public-ws-gateway should be added only when they are
# actually enabled in production.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging
    cluster: crypto-trading

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: alertmanager

  # Telegram bridge delivery path
  - job_name: 'telegram-bridge'
    static_configs:
      - targets: ['telegram-bridge:9095']
        labels:
          service: telegram-bridge

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: node-exporter

  # cAdvisor (container CPU/memory/restart/running metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor

  # Docker healthcheck exporter (healthy/unhealthy/exited state)
  - job_name: 'docker-health-exporter'
    static_configs:
      - targets: ['docker-health-exporter:9108']
        labels:
          service: docker-health-exporter

  # Crypto Trading Backend
  - job_name: 'crypto-backend'
    static_configs:
      - targets: ['crypto_backend:3000']
        labels:
          service: crypto-backend
    metrics_path: '/api/v1/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Default Go service that is enabled in the baseline production profile.
  - job_name: 'go-market-aggregator'
    static_configs:
      - targets: ['crypto_market_aggregator:8080']
        labels:
          service: market-aggregator
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Kafka broker JMX exporter (sidecar: bitnami/jmx-exporter)
  # Exposes broker MBeans (controller quorum, JVM, request metrics) on :9101.
  # Joined to backend-network via docker-compose.{prod,staging}.yml; see
  # `monitoring/kafka-jmx-exporter.yml` for the metric allowlist.
  - job_name: 'kafka-jmx'
    static_configs:
      - targets: ['kafka-jmx-exporter:9101']
        labels:
          service: kafka-broker
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
